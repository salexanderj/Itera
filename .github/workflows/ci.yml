name: CI

# Every push to main that changes more than docs, every pull request, and by hand: the format check, a Debug build
# (warnings are errors), and the whole suite, with the Debug-only checks, on Linux. A repository whose pushes another's
# run already tests (Itera's, pulled at once into a game) sets CI_ON_PUSH to off. .claude/rules/ci.md describes the
# workflows and their variables.
on:
  push:
    branches: [main]
    # Docs alone: the documentation tests run before each commit, and the next run or the nightly runs them again.
    paths-ignore:
      - "**.md"
      - "design/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

# A newer push cancels a run still going, so a burst of pushes runs the suite once, on the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PYTHONUTF8: 1
  ITERA_TEST_TIME_SCALE: ${{ vars.CI_TEST_TIME_SCALE }}
  CI_TEST_WALL_LIMIT: ${{ vars.CI_TEST_WALL_LIMIT }}

jobs:
  linux:
    name: Linux, Debug
    if: github.event_name != 'push' || vars.CI_ON_PUSH != 'off'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare

      - name: Restore the tools
        run: dotnet tool restore

      - name: Check the format
        run: dotnet csharpier check .

      - uses: ./.github/actions/test
        with:
          configuration: Debug
